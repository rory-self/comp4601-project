save-temps=1
temp_dir=link_tmp
report_dir=link_tmp/reports
log_dir=link_tmp/logs

[connectivity]
nk=arith_kernel:1:arith_kernel_1

# --- Kernel clock selection (KV260 platform exposes fixed clocks) ---
#   id 0 = 100 MHz,  id 1 = 200 MHz (default),  id 2 = 400 MHz
# For g4 (safe) leave the default (200 MHz) or set id 1 explicitly:
[clock]
id=1:arith_kernel_1
# For the g2 "max" attempt, comment the line above and use:
# id=2:arith_kernel_1
