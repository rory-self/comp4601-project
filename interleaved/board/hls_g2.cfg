part=xck26-sfvc784-2LV-c

# Optional "max clock" variant: 2 engines + registered DSP multiply.
# HLS Fmax ~402 MHz (II=1); pair with clock id 2 (400 MHz) at link time.
# Higher risk: 402 vs 400 is a thin margin, may not close post-route.

[hls]
flow_target=vitis
package.output.format=xo
package.output.syn=false
syn.top=arith_kernel
syn.file=arith_board_v2.cpp
syn.file=arith_interleaved_v2.cpp
syn.file=arith_interleaved_v2.h
syn.cflags=-DLANES=16 -DGROUPS=2 -DREG_MUL -DBOARD_WRAP
tb.file=arith_board_v2_test.cpp
tb.file=arith_interleaved_v2.h
tb.cflags=-DLANES=16 -DGROUPS=2 -DREG_MUL -DBOARD_WRAP
clock=2.5ns
